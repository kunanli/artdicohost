name: Checks and Hong Kong OSS/FC deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      PUBLIC_API_BASE: "https://api.artdico.host"
      PUBLIC_CONTENT_API_ORIGIN: "https://api.artdico.host"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Set up the pinned package manager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.25.0"
          run_install: false
          cache: false
      - name: Install locked dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Check source boundaries
        run: pnpm check:source
      - name: Check types and Astro source
        run: pnpm check
      - name: Run tests
        run: pnpm test
      - name: Build the static site
        run: pnpm build
      - name: Audit application and build dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm audit --audit-level=moderate
      - name: Prepare the exact reviewed FC startup package
        run: |
          artdico_node_binary="$(node -p 'process.execPath')"
          node scripts/prepare-fc-bootstrap.mjs --node-binary "$artdico_node_binary" --node-sha256 bc17c508ffeed0ec622934f9b7fa72f8e78da65350e63c3eceb56fa688aa5e12 --source-commit "$GITHUB_SHA" --out .local-data/fc-build
          mkdir -m 700 .local-data/fc-publication
          cp .local-data/fc-build/artdicohost-fc-preflight.zip .local-data/fc-build/package-manifest.json .local-data/fc-publication/
          node scripts/verify-fc-package.mjs .local-data/fc-publication "$GITHUB_SHA"
      - name: Smoke test the actual ZIP offline with read-only code and bounded temporary runtime
        run: |
          mkdir -m 755 "$RUNNER_TEMP/artdico-fc-smoke"
          unzip -q .local-data/fc-publication/artdicohost-fc-preflight.zip -d "$RUNNER_TEMP/artdico-fc-smoke"
          docker build --network none -t artdicohost-fc-smoke - < deploy/Dockerfile.fc-smoke
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 64 --memory 512m --cpus 0.35 --user 1000:1000 --tmpfs /tmp:rw,nosuid,nodev,exec,size=192m,mode=1777 --mount "type=bind,src=$RUNNER_TEMP/artdico-fc-smoke,dst=/code,readonly" --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/smoke-fc-bootstrap.py,dst=/verify.py,readonly" artdicohost-fc-smoke python3 -I -S /verify.py
      - name: Retain checked FC startup package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fc-publication-${{ github.sha }}
          path: .local-data/fc-publication/
          if-no-files-found: error
          retention-days: 14
      - name: Prepare and verify the separate cloud content candidate
        run: |
          artdico_candidate_node="$(node -p 'process.execPath')"
          node scripts/prepare-cloud-content.mjs --node-binary "$artdico_candidate_node" --node-sha256 bc17c508ffeed0ec622934f9b7fa72f8e78da65350e63c3eceb56fa688aa5e12 --source-commit "$GITHUB_SHA" --out .local-data/cloud-content-build
          node scripts/verify-cloud-content-package.mjs .local-data/cloud-content-build/publication "$GITHUB_SHA"
      - name: Smoke test the candidate ZIP offline without real accounts or storage
        run: |
          mkdir -m 755 "$RUNNER_TEMP/artdico-cloud-content-smoke"
          unzip -q .local-data/cloud-content-build/publication/artdicohost-cloud-content-candidate.zip -d "$RUNNER_TEMP/artdico-cloud-content-smoke"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 64 --memory 512m --cpus 0.35 --user 1000:1000 --tmpfs /tmp:rw,nosuid,nodev,exec,size=192m,mode=1777 --mount "type=bind,src=$RUNNER_TEMP/artdico-cloud-content-smoke,dst=/code,readonly" --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/smoke-cloud-content.py,dst=/verify.py,readonly" artdicohost-fc-smoke python3 -I -S /verify.py
      - name: Retain the reviewed cloud content publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-content-candidate-${{ github.sha }}
          path: .local-data/cloud-content-build/publication/
          if-no-files-found: error
          retention-days: 14
      - name: Observe the fixed public content endpoint without credentials
        timeout-minutes: 1
        continue-on-error: true
        run: node scripts/probe-content-endpoint.mjs
      - name: Report that FC updates still need one-time setup
        if: ${{ vars.ARTDICO_FC_DEPLOY_ENABLED != 'true' }}
        run: echo 'FC automatic deployment is disabled. The cloud-content publication was checked; artdicohost-api was not updated.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the pinned official deployment tool without credentials
        run: bash scripts/install-ossutil.sh "$RUNNER_TEMP/artdico-ossutil-check"
      - name: Prepare public-only OSS publication
        run: node scripts/prepare-oss-site.mjs .local-data/oss-publish
      - name: Retain checked public publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oss-publication-${{ github.sha }}
          path: .local-data/oss-publish/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain lockfile and static output for review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-check-output
          path: |
            package.json
            pnpm-lock.yaml
            dist/
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Publish public site to Hong Kong OSS
    needs: [check, deploy-fc]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'kunanli/artdicohost' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the exact checked source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js without installing build dependencies
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Download this run's checked public publication
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oss-publication-${{ github.sha }}
          path: .local-data/oss-publish/
      - name: Install checksum-pinned official ossutil
        run: bash scripts/install-ossutil.sh "$RUNNER_TEMP/artdico-ossutil"
      - name: Upload and verify public website objects
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OSS_ACCESS_KEY_ID: ${{ secrets.ARTDICO_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ARTDICO_OSS_ACCESS_KEY_SECRET }}
        run: node scripts/deploy-oss.mjs .local-data/oss-publish "$RUNNER_TEMP/artdico-ossutil/ossutil-2.4.0-linux-amd64/ossutil"
      - name: Verify the exact release through the public HTTPS domain without credentials
        run: node scripts/verify-public-domain.mjs .local-data/oss-publish

  deploy-fc:
    name: Publish and verify the complete Hong Kong cloud lifecycle
    needs: check
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'kunanli/artdicohost' && vars.ARTDICO_FC_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: artdicohost-production-fc
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out the exact checked source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up the pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Download this run's checked cloud-content publication
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloud-content-candidate-${{ github.sha }}
          path: .local-data/cloud-content-publication/
      - name: Quiesce, publish, configure, prove private storage and activate the exact checked source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTDICO_FC_DEPLOY_ENABLED: ${{ vars.ARTDICO_FC_DEPLOY_ENABLED }}
          ARTDICO_FC_ACCOUNT_ID: ${{ vars.ARTDICO_FC_ACCOUNT_ID }}
          ARTDICO_CLOUD_LIFECYCLE_ENABLED: "true"
          ARTDICO_CLOUD_ADMIN_SETUP_ENABLED: "true"
          ARTDICO_REGISTRATION_SETUP_ENABLED: "true"
          FC_ACCESS_KEY_ID: ${{ secrets.ARTDICO_OSS_ACCESS_KEY_ID }}
          FC_ACCESS_KEY_SECRET: ${{ secrets.ARTDICO_OSS_ACCESS_KEY_SECRET }}
          ARTDICO_ADMIN_PASSWORD: ${{ secrets.ARTDICO_ADMIN_PASSWORD }}
          ARTDICO_ADMIN_USERNAME: ${{ vars.ARTDICO_ADMIN_USERNAME }}
          ARTDICO_ADMIN_EMAIL: ${{ vars.ARTDICO_ADMIN_EMAIL }}
        run: node scripts/cloud-lifecycle.mjs .local-data/cloud-content-publication
      - name: Verify all fixed admin subpages through the activated HTTPS API domain without credentials
        timeout-minutes: 1
        run: node scripts/verify-cloud-admin-pages.mjs .local-data/cloud-content-publication
      - name: Verify anonymous public content and frontend CORS without credentials
        timeout-minutes: 1
        run: node scripts/verify-public-content.mjs
