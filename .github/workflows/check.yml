name: Frontend checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Set up the pinned package manager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.25.0"
          run_install: false
          cache: false
      - name: Install locked dependencies
        id: install
        run: pnpm install --no-frozen-lockfile
      - name: Check source boundaries
        run: pnpm check:source
      - name: Check types and Astro source
        run: pnpm check
      - name: Run tests
        run: pnpm test
      - name: Build the static site
        run: pnpm build
      - name: Export public build for offline review
        run: node scripts/export-review-data.mjs
      - name: Audit application and build dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm audit --audit-level=moderate
      - name: Retain lockfile and static output for review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-check-output
          path: |
            package.json
            pnpm-lock.yaml
            dist/
          if-no-files-found: error
          retention-days: 3
